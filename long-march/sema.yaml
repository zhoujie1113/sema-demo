# 项目元信息：展示站（根目录 index.html）会读取本文件渲染项目卡片与详情面板
name: 长征·征途
description: 面向历史课堂的中文交互式网站，以中央红军长征路线为主线，总览地图、阶段路线、节点详情与教师演示模式。
author: zhoujie1113
tags: [教育, 历史, 地图]

# 生成本项目使用的对话模型与生图模型
model: deepseek-v4.1-flash-1017
image_model: gpt-image-2.5-flare

# 从零生成到可交付的用时
duration: 51min

# 本地启动命令（在本目录下执行），启动后用浏览器打开对应地址
run: python3 -m http.server 8931 --bind 127.0.0.1
url: http://127.0.0.1:8931/

# 一句输入、从零生成本项目所用的完整需求提示词
prompt: |
  从零制作一个用于历史课演示的中文交互式网站《长征·征途》，以中央红军长征路线为主线，通过总览地图、阶段路线和事件详情，让学生理解长征的时间顺序、地理跨度与重要历史节点。
  **首页是一张完整的长征路线总览地图。**地图占据主要画面，标出起点、终点、重要地点、行进方向和沿途主要山脉河流，并配有时间轴。根据历史进程划分为 5 个阶段，用不同颜色标识各阶段路线。阶段划分、名称和时间范围依据可靠史料确定，明确说明展示的是中央红军主线及其与长征整体历史的关系。
  **点击地图上的阶段路线或阶段名称，进入对应的详细路线图。**展示该阶段的起止地点、时间范围、行进方向和 3～5 个关键节点，并保留小型总览地图，提示当前阶段在全程中的位置。支持上一阶段、下一阶段和返回全程，切换时保持清晰的空间关系。
  **点击关键节点，展开事件详情。**每个节点包含时间、地点、事件经过、面临的困难和历史意义，以适合课堂讲解的简短中文呈现。结合地形说明行军与路线选择的背景，并提供一个引导学生观察或思考的问题。首页避免堆砌长篇文字，详细内容按点击逐层展开。
  **提供适合教师操作的演示模式。**支持全屏、大字号、键盘左右键切换阶段，以及“逐步显示路线”和“一键显示全程”。逐步显示时，路线按照历史顺序延伸，并同步突出当前地点与时间；支持暂停和重播。动画用于说明路线，不将历史行军速度表现为真实比例。
  **视觉采用历史地图与手绘地理插画结合的风格。**使用暖纸色背景、清楚的路线配色和克制的转场动画，保证投影时文字与地图标记容易辨认。使用图像生成工具制作首页装饰及山川场景插画，并实际接入页面。地图、路线、地名和时间文字采用可准确定位与编辑的方式实现；生成插画标注为示意，不能冒充历史照片。若地图经过简化，明确标注“路线示意图，非精确测绘”。
  **历史准确性是验收要求。**制作前查阅权威党史、博物馆或档案机构资料，核对时间、地点、事件和路线顺序，避免混淆不同红军部队的路线。为阶段介绍和重要事件提供可查看的来源链接；对无法确认的路线细节保持概括，不编造精确坐标、引语或史料。
  在浏览器中实际走完“全程总览 → 阶段路线 → 节点详情 → 下一阶段 → 返回总览”的完整演示流程，检查全部 5 个阶段、路线播放、键盘操作、全屏和文字可读性，修复发现的问题。最终交付可访问的网页预览、完整源码，以及一份简短的课堂演示操作说明。
