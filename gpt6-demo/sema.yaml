# 项目元信息：展示站（根目录 index.html）会读取本文件渲染项目卡片与详情面板
name: 落日海岸
description: 浏览器实时 3D 驾驶 demo，写实向海滨街区，从汽车旅馆停车场出发穿过检查点，把货送到海边停车区。
author: zhoujie1113
tags: [游戏, 3D, 驾驶, Three.js]
entry: dist/index.html

# 生成本项目使用的对话模型与生图模型
model: deepseek-v4.1-flash-1017
image_model: gpt-image-2.5-flare

# 从零生成到可交付的用时
duration: 约 47 分钟

# 本地启动命令（在本目录下执行），启动后用浏览器打开对应地址
run: npm install && npm run dev
url: http://127.0.0.1:5173/

# 一句输入、从零生成本项目所用的完整需求提示词
prompt: |
  从零制作一款中文 3D 浏览器驾驶游戏 demo《落日海岸》，采用接近 GTA5 海滨街区的写实美术方向。场景紧凑、细节丰富，提供约 3～5 分钟的完整游玩体验，重点展示素材整合、场景渲染、驾驶交互和浏览器调试的全过程。
  游戏必须在浏览器中实时运行，打开网页链接、等待资源加载后即可游玩，无需安装游戏客户端，不依赖本机游戏引擎或云端串流。优先使用 Three.js 或 Babylon.js，以桌面 Chrome、Edge 和键盘操作为主要使用环境。提供资源加载进度、加载失败提示和重试入口。
  制作“汽车旅馆停车场 → 棕榈树街道 → 海边交付点”的连续可驾驶场景。道路能够往返行驶，沿途布置便利店、路灯、广告牌、路标和海岸背景，主要地点容易辨认。采用写实比例、日落光照、柔和阴影、清晰的道路材质和具有反射质感的车漆。重点打磨玩家车辆、停车场和沿途近景建筑，避免积木式街区。建筑只需外观，不制作室内；不扩展大型城市、多人模式或复杂交通系统。
  优先检查并使用此前找到的候选资源：YD92 的 Motel 汽车旅馆、donnichols 的 Low-Poly Sports Car Free 跑车、Next Spring 的 Realistic Palm Tree Free 棕榈树，以及 Poly Haven 的 Worn Asphalt 沥青材质和 Belfast Sunset 日落环境光。核对下载条件、许可、模型格式和贴图完整性，将可用资源转换、优化并实际接入游戏，统一模型尺度、材质和色彩。对模型面数、贴图分辨率及重复物体进行必要优化，兼顾画面与加载速度。无法获取或不适合浏览器的资源，自主寻找许可明确、风格相近的免费替代品；需要付费时先说明，不自行购买。
  使用图像生成工具制作原创旅馆招牌、店铺广告海报和开始页插画，并实际用于场景和界面。车辆、建筑和道路必须是可实时交互的 3D 场景对象。记录所有外部素材的来源、作者和许可，按要求保留署名。
  玩家开始时已坐在旅馆停车场的一辆跑车内，使用第三人称追尾镜头，无需实现步行、上下车和人物动画。使用 WASD 或方向键控制加速、刹车、倒车和转向，空格控制手刹，R 将车辆复位到最近的安全位置，Esc 暂停或恢复游戏。
  驾驶手感采用易上手的街机风格，具有平滑加速、随车速变化的转向和明确的制动反馈。车辆与建筑、护栏等障碍物存在碰撞，不能穿墙或驶入海中。镜头平滑跟随，避免明显穿墙、剧烈抖动或被建筑持续遮挡。
  玩家从汽车旅馆停车场开始，确认送件任务后启动计时，沿地图指引依次经过街道检查点，最终到达海边指定停车区。任务包含“待出发 → 运送中 → 等待交付 → 已完成”的完整状态。到达终点且车辆停稳后，显示按 E 交付的提示；玩家主动交付后才判定成功，不能高速路过终点即完成任务。
  每个阶段提供明确的中文目标提示、地图标记和完成反馈。任务完成后显示用时，并提供重新挑战和自由驾驶功能。重新挑战必须重置车辆位置、检查点、计时和任务状态。
  提供开始页、操作说明、当前任务、小地图、速度显示、暂停菜单和结算界面。小地图实时显示道路、玩家位置与朝向、检查点和交付目标。界面采用简洁的城市街头风格，中文清晰可读，提示不遮挡驾驶视野，在常见桌面窗口尺寸下正常显示。
  加入适度的引擎和海浪声音，引擎声随驾驶状态变化。声音在玩家开始游戏后启用，提供静音按钮；暂停时同步处理游戏计时和相关音效。
  先完成“一辆车＋汽车旅馆停车场”的可运行视觉样板，在浏览器中检查模型、贴图、光照、镜头和运行表现，调整后继续扩展完整场景。
  在浏览器中实际操作完成开始游戏、驾驶、经过检查点、停车交付、任务结算、自由驾驶和重新挑战的全过程。检查碰撞、车辆复位、小地图更新、暂停恢复、任务顺序及终点判定，修复发现的问题并复测。
  检查资源加载失败、窗口尺寸变化和连续重开时的行为。记录实际测试环境与运行表现，不将未经验证的性能指标写成已达成结果。保留关键画面截图及简短的问题修复记录。
  最终交付可在浏览器直接游玩的预览地址、完整源码与运行所需素材、资源来源和许可清单，以及简短的操作说明和验收结果。明确预览地址是本地访问还是公网访问；如果尚未部署公网，不将本地地址描述为可供他人远程访问的链接。
