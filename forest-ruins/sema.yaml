# 项目元信息：展示站（根目录 index.html）会读取本文件渲染项目卡片与详情面板
name: 森林遗迹
description: 俯视角绘本风格的中文网页推箱子解谜游戏，5 个经过验证可解的关卡，支持撤销、重置与进度保存。
author: zhoujie1113
tags: [游戏, 解谜, 推箱子]

# 生成本项目使用的对话模型与生图模型
model: deepseek-v4.1-flash-1017
image_model: gpt-image-2.5-flare

# 从零生成到可交付的用时
duration: 约 20 分钟

# 本地启动命令（在本目录下执行），启动后用浏览器打开对应地址
run: python3 -m http.server 8080
url: http://127.0.0.1:8080/

# 一句输入、从零生成本项目所用的完整需求提示词
prompt: |
  从零制作可完整游玩的中文网页解谜游戏《森林遗迹》，采用精致的俯视角绘本风格。
  核心玩法为推箱子：玩家每次移动一格，只能推动一块能量石，不能拉动或连续推动多块；墙壁不可穿越。当所有能量石都放到对应数量的机关上时，出口开启，玩家走入出口后通关。
  制作 5 个由易到难、经过验证可解的关卡。支持方向键和屏幕方向按钮、单步撤销、重置当前关卡，以及已解锁关卡切换；自动保存已解锁关卡，刷新后保留。提供简短操作提示和全部通关后的结算界面。
  使用图像生成工具制作并接入角色、能量石、地面、机关和森林背景装饰，确保墙壁、道路、机关及出口清晰可辨。
  在浏览器中实际操作完成全部 5 关，验证碰撞、推石规则、撤销、重置、进度保存和通关判定，修复发现的问题，交付可玩的预览。
